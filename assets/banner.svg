<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="claude-skills: install once and your AI coding agent follows senior engineering rules and checks its own code before it says done. Example: the agent wrote code and all tests passed, but the skills caught an email sent inside a transaction, an order any user could read, and one query per row.">
  <defs>
    <radialGradient id="glow" cx="88%" cy="0%" r="70%">
      <stop offset="0" stop-color="#E8C766" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E8C766" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="460" rx="24" fill="#0A0A0A"/>
  <rect width="1280" height="460" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="460" rx="24" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="459" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Left: what it is, what it does, how to get it -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <rect x="64" y="60" width="330" height="30" rx="15" fill="#E8C766" fill-opacity="0.12" stroke="#E8C766" stroke-opacity="0.35"/>
    <text x="229" y="80" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1" fill="#EFD88F">FOR CLAUDE CODE · CURSOR · CODEX</text>

    <text x="62" y="160" font-size="60" font-weight="800" letter-spacing="-2" fill="#FAFAFA">claude-skills</text>

    <text x="64" y="208" font-size="23" fill="#E5E5E5">Install once. Your AI coding agent follows</text>
    <text x="64" y="240" font-size="23" fill="#E5E5E5">senior engineering rules, and checks its</text>
    <text x="64" y="272" font-size="23" fill="#E5E5E5">own code before it says <tspan fill="#EFD88F" font-weight="600">done</tspan>.</text>

    <rect x="64" y="318" width="476" height="56" rx="12" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="88" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#737373">$ <tspan fill="#E5E5E5">/plugin install</tspan> <tspan fill="#EFD88F">engineering@mgamalhz</tspan></text>

    <text x="64" y="408" font-size="15" fill="#737373">architecture · security · performance · database-design · code-audit</text>
  </g>

  <!-- Right: a concrete before/after -->
  <g transform="translate(640 60)">
    <rect width="576" height="340" rx="16" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="28" cy="28" r="6" fill="#2A2A2A"/>
    <circle cx="48" cy="28" r="6" fill="#2A2A2A"/>
    <circle cx="68" cy="28" r="6" fill="#2A2A2A"/>
    <text x="96" y="33" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#A3A3A3">The agent wrote it. <tspan fill="#4ADE80">All tests pass.</tspan> But:</text>
    <line x1="0" y1="56" x2="576" y2="56" stroke="#FFFFFF" stroke-opacity="0.07"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <g transform="translate(28 96)">
        <text fill="#F87171">✗</text>
        <text x="24" fill="#E5E5E5">Mail::send() inside DB::transaction</text>
        <text x="24" y="22" font-size="13" fill="#A3A3A3">email goes out for an order that rolled back</text>
      </g>
      <g transform="translate(28 164)">
        <text fill="#F87171">✗</text>
        <text x="24" fill="#E5E5E5">GET /orders/15 by another user</text>
        <text x="24" y="22" font-size="13" fill="#A3A3A3">any user can read any order</text>
      </g>
      <g transform="translate(28 232)">
        <text fill="#F87171">✗</text>
        <text x="24" fill="#E5E5E5">$order-&gt;customer inside foreach</text>
        <text x="24" y="22" font-size="13" fill="#A3A3A3">one query per row, slow at 10k rows</text>
      </g>
      <g font-size="12" font-weight="600" text-anchor="middle">
        <text x="492" y="72" font-size="11" font-weight="400" fill="#737373">caught by</text>
        <rect x="436" y="80" width="112" height="24" rx="12" fill="#E8C766" fill-opacity="0.12"/>
        <text x="492" y="96" fill="#EFD88F">architecture</text>
        <rect x="436" y="148" width="112" height="24" rx="12" fill="#E8C766" fill-opacity="0.12"/>
        <text x="492" y="164" fill="#EFD88F">security</text>
        <rect x="436" y="216" width="112" height="24" rx="12" fill="#E8C766" fill-opacity="0.12"/>
        <text x="492" y="232" fill="#EFD88F">performance</text>
      </g>
    </g>
    <line x1="0" y1="286" x2="576" y2="286" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <text x="28" y="318" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#E5E5E5"><tspan fill="#4ADE80">✓</tspan>  Caught and fixed before the commit, not in production.</text>
  </g>
</svg>
