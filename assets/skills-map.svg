<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-label="Skills map: architecture, security, performance and database-design are the rules; code-audit runs all four on a pull request or branch; a CLAUDE.md line runs them before every commit">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#E8C766"/>
    </marker>
  </defs>
  <rect width="1280" height="540" rx="24" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="1279" height="539" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="60" y="58" font-size="13" font-weight="600" letter-spacing="1.5" fill="#737373">THE RULES · LOADED WHEN THE TASK MATCHES</text>

    <g transform="translate(60 76)">
      <rect width="272" height="124" rx="16" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="24" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#EFD88F">architecture</text>
      <text x="24" y="76" font-size="17" fill="#E5E5E5">Where code lives</text>
      <text x="24" y="102" font-size="15" fill="#A3A3A3">Transactions, races, statuses</text>
    </g>
    <g transform="translate(356 76)">
      <rect width="272" height="124" rx="16" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="24" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#EFD88F">security</text>
      <text x="24" y="76" font-size="17" fill="#E5E5E5">Who can see what</text>
      <text x="24" y="102" font-size="15" fill="#A3A3A3">IDOR, uploads, webhooks</text>
    </g>
    <g transform="translate(652 76)">
      <rect width="272" height="124" rx="16" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="24" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#EFD88F">performance</text>
      <text x="24" y="76" font-size="17" fill="#E5E5E5">Fast as data grows</text>
      <text x="24" y="102" font-size="15" fill="#A3A3A3">N+1, indexes, caching</text>
    </g>
    <g transform="translate(948 76)">
      <rect width="272" height="124" rx="16" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="24" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#EFD88F">database-design</text>
      <text x="24" y="76" font-size="17" fill="#E5E5E5">The shape of the data</text>
      <text x="24" y="102" font-size="15" fill="#A3A3A3">Money, keys, dates</text>
    </g>

    <g stroke="#E8C766" stroke-width="2" stroke-opacity="0.7" fill="none" marker-end="url(#arrow)">
      <path d="M196 204 C196 236, 520 236, 548 262"/>
      <path d="M492 204 C492 232, 600 232, 610 260"/>
      <path d="M788 204 C788 232, 680 232, 670 260"/>
      <path d="M1084 204 C1084 236, 760 236, 732 262"/>
    </g>

    <g transform="translate(440 268)">
      <rect width="400" height="124" rx="16" fill="#E8C766" fill-opacity="0.08" stroke="#E8C766" stroke-opacity="0.55"/>
      <text x="200" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="600" fill="#EFD88F">code-audit</text>
      <text x="200" y="78" text-anchor="middle" font-size="17" fill="#E5E5E5">Runs all four on a PR or branch</text>
      <text x="200" y="104" text-anchor="middle" font-size="15" fill="#A3A3A3">Verdict, blockers, fixes, teaching mode</text>
    </g>

    <g transform="translate(60 428)">
      <rect width="1160" height="68" rx="16" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.1" stroke-dasharray="6 6"/>
      <text x="32" y="41" font-size="17" font-weight="600" fill="#FAFAFA">Before every commit</text>
      <text x="230" y="41" font-size="16" fill="#A3A3A3">Add one line to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#EFD88F">CLAUDE.md</tspan> and the four rules run automatically, with tests as proof.</text>
    </g>
  </g>
</svg>
