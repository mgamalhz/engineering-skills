<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="232" viewBox="0 0 1280 232" role="img" aria-label="How it works: you ask for a change, the agent loads the matching skill, then proves the rules hold before it says done">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#E8C766"/>
    </marker>
  </defs>
  <rect width="1280" height="232" rx="24" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="1279" height="231" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <!-- Step 1 -->
    <g transform="translate(48 40)">
      <rect width="344" height="152" rx="16" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="36" cy="38" r="16" fill="#E8C766"/>
      <text x="36" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#0A0A0A">1</text>
      <text x="64" y="44" font-size="20" font-weight="700" fill="#FAFAFA">You ask</text>
      <text x="24" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#E5E5E5">"Add an invoice upload"</text>
      <text x="24" y="124" font-size="15" fill="#A3A3A3">No skill names, no extra prompt.</text>
    </g>
    <line x1="400" y1="116" x2="460" y2="116" stroke="#E8C766" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <g transform="translate(468 40)">
      <rect width="344" height="152" rx="16" fill="#141414" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="36" cy="38" r="16" fill="#E8C766"/>
      <text x="36" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#0A0A0A">2</text>
      <text x="64" y="44" font-size="20" font-weight="700" fill="#FAFAFA">The skill loads</text>
      <text x="24" y="90" font-size="15" fill="#E5E5E5">"file uploads" matches the</text>
      <text x="24" y="114" font-size="15" fill="#E5E5E5"><tspan fill="#EFD88F" font-weight="600">security</tspan> description, so its</text>
      <text x="24" y="138" font-size="15" fill="#E5E5E5">rules guide the code.</text>
    </g>
    <line x1="820" y1="116" x2="880" y2="116" stroke="#E8C766" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 3 -->
    <g transform="translate(888 40)">
      <rect width="344" height="152" rx="16" fill="#141414" stroke="#E8C766" stroke-opacity="0.45"/>
      <circle cx="36" cy="38" r="16" fill="#E8C766"/>
      <text x="36" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#0A0A0A">3</text>
      <text x="64" y="44" font-size="20" font-weight="700" fill="#FAFAFA">It proves it</text>
      <text x="24" y="90" font-size="15" fill="#E5E5E5"><tspan fill="#4ADE80">✓</tspan> wrong file type rejected</text>
      <text x="24" y="114" font-size="15" fill="#E5E5E5"><tspan fill="#4ADE80">✓</tspan> stored on a private disk</text>
      <text x="24" y="138" font-size="15" fill="#E5E5E5"><tspan fill="#4ADE80">✓</tspan> other users get 403</text>
    </g>
  </g>
</svg>
